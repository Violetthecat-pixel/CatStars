<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=i=>document.getElementById(i),RN=['Rare','Super Rare','Epic','Mythic','Legendary'],RC=[0x4aa3ff,0x3ddc6b,0xc04bff,0xff3b5c,0xffd23f];
// Brawler names, titles and ability names contain no letter N
const B=[
{n:'Mochi',t:'Sweet Paws',r:0,c:0xffb3d9,hp:3600,dm:900,sp:5.5,rg:9,ab:'Hairball Blast',sh:0},
{n:'Tabby',t:'Stripe Racer',r:0,c:0xff9a3d,hp:3200,dm:1000,sp:6,rg:8,ab:'Stripe Storm',sh:1},
{n:'Coco',t:'Choco Chef',r:1,c:0x9c5b2e,hp:3800,dm:1100,sp:5.2,rg:8.5,ab:'Cocoa Splat',sh:2},
{n:'Socks',t:'Toy Tamer',r:2,c:0x9fa8ff,hp:3500,dm:1300,sp:5.8,rg:9.5,ab:'Sock Slam',sh:0},
{n:'Bolt',t:'Storm Chaser',r:3,c:0xffee33,hp:3300,dm:1500,sp:6.5,rg:10,ab:'Zap Whip',sh:1},
{n:'Ziggy',t:'Zig Zag Ace',r:4,c:0x62ffd0,hp:3900,dm:1700,sp:6.2,rg:10,ab:'Zig Zag Blitz',sh:2},
{n:'Glitz',t:'Block Empress',r:4,c:0xff5de0,hp:4200,dm:1900,sp:6.4,rg:10.5,ab:'Glitter Storm',sh:0}];
const Q=[{t:'Win 3 matches',k:'win',g:3,r:150},{t:'Deal 10,000 damage',k:'dmg',g:10000,r:150},{t:'Defeat 5 bots',k:'ko',g:5,r:100},{t:'Play 3 matches',k:'play',g:3,r:50}];
let S={co:1500,pp:0,tk:0,dr:3,own:{0:1},lv:{},sel:0,pm:0,cf:[],cp:[],q:[0,0,0,0],name:'Player',hpx:{},tr:0,diff:'noob',wins:0,best:99};
try{Object.assign(S,JSON.parse(localStorage.getItem('catstars')||'{}'))}catch(e){}
const sv=()=>{try{localStorage.setItem('catstars',JSON.stringify(S))}catch(e){}};
const addQ=(k,v)=>Q.forEach((q,i)=>{if(q.k==k)S.q[i]=Math.min(q.g,S.q[i]+v)});
const tier=()=>Math.min(30,S.tk/50|0);

/* ---------- audio ---------- */
let AC,mg,tm,want='m';const cu={};
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=.5;mg.connect(AC.destination);bgm(want)}if(AC.state=='suspended')AC.resume()}
function tone(f,t,d,ty,v,e){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t;o.type=ty;o.frequency.setValueAtTime(f,s);if(e)o.frequency.exponentialRampToValueAtTime(e,s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(mg);o.start(s);o.stop(s+d)}
const PT={m:{bpm:100,l:[0,4,7,12,7,4,9,5],b:[0,0,-5,-5],f:196},b:{bpm:136,l:[0,0,7,5,3,5,7,10],b:[0,0,3,5],f:220},s:{bpm:168,l:[0,3,7,3,10,7,12,3,0,3,7,3,10,7,15,12],b:[0,0,-2,-4],f:233}};
function stopB(){clearInterval(tm);for(const k of['m','b','s'])if(cu[k])cu[k].pause()}
function bgm(k){want=k;stopB();if(!AC)return;if(cu[k]){cu[k].currentTime=0;cu[k].play().catch(()=>{});return}const p=PT[k];let i=0;tm=setInterval(()=>{tone(p.f*2**(p.l[i%p.l.length]/12),0,.17,'square',.06);if(i%2==0)tone(p.f/2*2**(p.b[(i>>1)%p.b.length]/12),0,.3,'triangle',.12);i++},30000/p.bpm)}
function sfx(k,v){v=v||k;if(!AC)return;if(cu[k]&&k==v){const a=cu[k].cloneNode();a.play().catch(()=>{});return}
 if(v=='a')tone(650,0,.12,'square',.12,220);else if(v=='h')tone(200,0,.15,'sawtooth',.15,60);else if(v=='d')tone(120,0,.5,'sawtooth',.15,900);
 else if(v=='tap')tone(160,0,.1,'square',.2,80);else if(v=='up')[0,1,2,3].forEach(i=>tone(400*1.26**i,i*.07,.15,'triangle',.2));
 else if(v=='boom'){tone(90,0,.6,'sawtooth',.3,30);[0,1,2,3,4].forEach(i=>tone(500*1.25**i,.1+i*.08,.3,'triangle',.15))}}
[['m','Main Menu BGM'],['b','Normal Battle BGM'],['s','Showdown Battle BGM'],['a','Attack SFX'],['h','Hit SFX'],['d','Catt Drop Opening SFX']].forEach(([k,l])=>{
 const L=document.createElement('label');L.textContent=l+' (MP3)';const i=document.createElement('input');i.type='file';i.accept='audio/*';
 i.onchange=()=>{const f=i.files[0];if(!f)return;const a=new Audio(URL.createObjectURL(f));if('mbs'.includes(k))a.loop=true;cu[k]=a;toast(l+' loaded');if(want==k)bgm(k)};L.appendChild(i);$('sp').appendChild(L)});
let userTex=null;
function loadTex(u,save){new THREE.TextureLoader().load(u,t=>{t.encoding=THREE.sRGBEncoding;userTex=t;if(save){try{localStorage.setItem('catstars_tex',u)}catch(e){toast('Texture applied (too large to save)');return}}toast('Floor texture applied to next match')})}
$('tex').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>loadTex(r.result,1);r.readAsDataURL(f)};
try{const u=localStorage.getItem('catstars_tex');if(u)loadTex(u,0)}catch(e){}

/* ---------- three setup ---------- */
const rd=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});rd.setPixelRatio(Math.min(devicePixelRatio,2));rd.outputEncoding=THREE.sRGBEncoding;
const cam=new THREE.PerspectiveCamera(45,1,.1,200),cam2=new THREE.PerspectiveCamera(45,1,.1,100);
function rs(){const a=innerWidth/innerHeight;rd.setSize(innerWidth,innerHeight);cam.aspect=cam2.aspect=a;cam2.position.set(0,3,Math.min(16,9/Math.min(1,a*1.3)));cam.updateProjectionMatrix();cam2.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
const mat=(c)=>new THREE.MeshPhongMaterial({color:c,shininess:120,specular:0xffffff}),M=THREE.Mesh;
const BM={},bm=c=>BM[c]||(BM[c]=new THREE.MeshPhongMaterial({color:c,emissive:c,emissiveIntensity:.5})),SG=new THREE.SphereGeometry(1,10,8);
function cat(b){const g=new THREE.Group(),m=mat(b.c),d=mat(0x222222),a=mat(RC[b.r]);
 const add=(geo,mt,x,y,z,p,to)=>{const o=new M(geo,mt);o.position.set(x,y,z);if(p)Object.assign(o.rotation,p);(to||g).add(o);return o};
 add(new THREE.SphereGeometry(.5,16,12),m,0,.55,0).scale.set(1,1.1,.9);
 add(new THREE.SphereGeometry(.45,16,12),m,0,1.3,0);
 [-1,1].forEach(s=>{add(new THREE.ConeGeometry(.17,.4,4),m,s*.28,1.72,0,{z:-s*.3});add(new THREE.SphereGeometry(.06,8,8),d,s*.17,1.35,.38);
  [0,1].forEach(i=>add(new THREE.CylinderGeometry(.012,.012,.5),d,s*.4,1.2+i*.07,.38,{z:Math.PI/2+s*(.15-i*.3)}))});
 add(new THREE.SphereGeometry(.07,8,8),mat(0xff6688),0,1.25,.43);
 add(new THREE.CylinderGeometry(.07,.05,.8),m,0,.5,-.5,{x:-1});
 const w=new THREE.Group();w.position.set(.6,.7,.35);g.add(w);
 add(b.sh==1?new THREE.BoxGeometry(.2,.2,.8):new THREE.CylinderGeometry(.1,.14,.8),a,0,0,0,{x:b.sh==1?0:Math.PI/2},w);
 add(new THREE.SphereGeometry(b.sh==2?.25:.15,10,8),m,0,0,.5,0,w);return g}
const FX=[];
function burst(sc,x,y,z,col,n,sp){const p=new Float32Array(n*3),v=[];for(let i=0;i<n;i++){p[i*3]=x;p[i*3+1]=y;p[i*3+2]=z;const a=Math.random()*6.283,b=Math.random()*2-1,s=Math.sqrt(1-b*b),m=sp*(.3+Math.random());v.push(Math.cos(a)*s*m,b*m+sp*.3,Math.sin(a)*s*m)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));const o=new THREE.Points(g,new THREE.PointsMaterial({color:col,size:.25,transparent:true}));sc.add(o);FX.push({o,v,l:1,sc})}
function fxu(dt){for(let i=FX.length-1;i>=0;i--){const f=FX[i],p=f.o.geometry.attributes.position.array;for(let j=0;j<p.length/3;j++){f.v[j*3+1]-=9*dt;for(let k=0;k<3;k++)p[j*3+k]+=f.v[j*3+k]*dt}f.o.geometry.attributes.position.needsUpdate=true;f.l-=dt*1.2;f.o.material.opacity=f.l;if(f.l<=0){f.sc.remove(f.o);f.o.geometry.dispose();FX.splice(i,1)}}}
function card(ls,col){const c=document.createElement('canvas');c.width=512;c.height=256;const x=c.getContext('2d'),h='#'+col.toString(16).padStart(6,'0');x.fillStyle='#1b0c3e';x.fillRect(0,0,512,256);x.strokeStyle=h;x.lineWidth=14;x.strokeRect(7,7,498,242);x.textAlign='center';
 ls.forEach((l,i)=>{x.font=(i?'bold 28px':'900 54px')+' sans-serif';x.fillStyle=i==1?h:'#fff';x.fillText(l,256,70+i*50)});
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c)}));s.scale.set(4,2,1);return s}

/* ---------- stage (menu / drop / reveal) ---------- */
const ST=new THREE.Scene();ST.background=new THREE.Color(0x3a1d7a);
ST.add(new THREE.HemisphereLight(0xffffff,0x6644aa,.9));const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(3,6,5);ST.add(dl);
const ped=new M(new THREE.CylinderGeometry(2.2,2.4,.4,32),mat(0xff4fa3));ped.position.y=-.2;ST.add(ped);
const decor=[];for(let i=0;i<14;i++){const o=new M(i%2?new THREE.BoxGeometry(.8,.8,.8):new THREE.SphereGeometry(.45,12,10),mat(RC[i%5]));const a=i/14*6.283;o.position.set(Math.cos(a)*6,1+Math.random()*3,Math.sin(a)*6-3);ST.add(o);decor.push(o)}
const SP=[0xff4fa3,0x4de8ff,0xffe46b].map(c=>{const s=new THREE.SpotLight(c,0,30,.45,.5);s.position.set(0,6,5);ST.add(s);return s});
let so=null,mode='menu',cs=0,T=0,D=null,RV=null,box=null,RET='drop';
const setStage=o=>{if(so)ST.remove(so);so=o;if(o)ST.add(o)};
function showCat(){const c=cat(B[S.sel]);c.scale.setScalar(1.5);setStage(c)}
function go(id){document.querySelectorAll('.scr').forEach(e=>e.classList.remove('on'));$(id).classList.add('on');mode=id;upd()}
function home(){SP.forEach(s=>s.intensity=0);showCat();go('menu');bgm('m')}
function upd(){$('c4').textContent='🏆 '+S.tr;rDf();$('c1').textContent='🪙 '+S.co;$('c2').textContent='⚡ '+S.pp+' PP';$('c3').textContent='🎟 Tier '+tier()+'/30';$('bd').textContent='Catt Drop ('+S.dr+')'}
let tt;function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,1800)}
function flash(c){const f=$('fl');f.style.transition='none';f.style.background='#'+c.toString(16).padStart(6,'0');f.style.opacity=.9;requestAnimationFrame(()=>{f.style.transition='opacity .5s';f.style.opacity=0})}

/* ---------- Catt Drop ---------- */
function mkBox(){const g=new THREE.Group();g.bm=mat(RC[0]);const b=new M(new THREE.BoxGeometry(1.6,1.2,1.6),g.bm);b.position.y=.6;const l=new M(new THREE.BoxGeometry(1.8,.4,1.8),g.bm);l.position.y=1.4;
 const s=new M(new THREE.BoxGeometry(.4,1.65,1.65),mat(0xffffff));s.position.y=.8;const p=new M(new THREE.SphereGeometry(.3,12,10),mat(0xffe46b));p.position.set(0,.7,.85);g.add(b,l,s,p);return g}
function openDrop(){if(S.dr<1){if(S.co<150)return toast('Need a Catt Drop or 150 coins');S.co-=150}else S.dr--;sv();ac();
 const x=Math.random()*100,th=[.5,2,6,14,29],ti=th.findIndex(v=>x<v);let res;
 if(ti>=0)res={k:'br',v:5-ti,T:4-ti};else{const q=Math.random()*3|0;res=Math.random()<.6?{k:'co',v:[100,200,350][q],T:q}:{k:'pp',v:[20,45,80][q],T:q}}
 RET='drop';box=mkBox();D={res,tier:0,vy:0,y:0,sk:0,done:0};setStage(box);go('drop');$('dm').textContent='TAP THE BOX!';$('dbtn').style.display='none'}
function tap(){if(!D||D.done)return;ac();D.vy=6;D.sk=1;sfx('d','tap');
 if(D.tier<D.res.T){D.tier++;box.bm.color.setHex(RC[D.tier]);flash(RC[D.tier]);burst(ST,0,1.5,0,RC[D.tier],70,6);cs=.5;sfx('d','up');$('dm').textContent=RN[D.tier]+' Catt Drop! Tap!'}
 else{D.done=1;sfx('d','boom');flash(0xffffff);cs=1;[0xffe46b,0xff4fa3,0x4de8ff].forEach(c=>burst(ST,0,1.2,0,c,80,9));setStage(null);$('dm').textContent='';
  const r=D.res;setTimeout(()=>{if(r.k=='br'){if(S.own[r.v]){S.pp+=150;sv();revealItem('Duplicate!','+150 Power Points',RC[r.T],1)}else revealBr(r.v)}
   else{if(r.k=='co')S.co+=r.v;else S.pp+=r.v;sv();revealItem(r.k=='co'?'+'+r.v+' Coins':'+'+r.v+' Power Points','Catt Drop Reward',RC[r.T],r.k=='co')}},500)}}
function revealBr(id){const b=B[id];S.own[id]=1;sv();const g=new THREE.Group(),c=cat(b);c.scale.setScalar(1.6);g.add(c);
 const cd=card([b.n,b.t+' - '+RN[b.r],'HP '+b.hp+'  DMG '+b.dm+'  SPD '+b.sp,'Super: '+b.ab],RC[b.r]);cd.position.y=4.6;g.add(cd);RV={t:0,c,cd};setStage(g);SP.forEach(s=>s.intensity=2.2);go('rev');revUI();burst(ST,0,1,0,RC[b.r],120,8)}
function revealItem(a,b,col,coin){const g=new THREE.Group(),o=new M(coin?new THREE.CylinderGeometry(.9,.9,.25,32):new THREE.OctahedronGeometry(.9),mat(coin?0xffd23f:0xb06bff));if(coin)o.rotation.x=Math.PI/2;const h=new THREE.Group();h.add(o);h.position.y=1.3;g.add(h);
